<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="1024" height="1024">
  <defs>
    <!-- This mask keeps the text untouched but cuts a gap exactly where the checkmark goes -->
    <mask id="cutout">
      <rect width="100%" height="100%" fill="#FFFFFF" />
      <path d="M 102 140 L 128 166 L 176 102" fill="none" stroke="#000000" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
    </mask>
  </defs>

  <g>
      <!-- Clean Regular Typography, masked by the cutout -->
      <text x="128" y="172" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="700" font-size="92" fill="#1a1a1a" letter-spacing="-0.02em" text-anchor="middle" mask="url(#cutout)">UAT</text>

      <!-- Ink outline behind the checkmark so it reads against white -->
      <path d="M 102 140 L 128 166 L 176 102" fill="none" stroke="#1a1a1a" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Integrated Checkmark filling the gap -->
      <path d="M 102 140 L 128 166 L 176 102" fill="none" stroke="#ACCDB5" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
