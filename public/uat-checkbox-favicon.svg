<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Checkbox Frame -->
  <rect x="8" y="8" width="48" height="48" rx="8" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="6" />

  <!-- Ink outline behind the checkmark so it reads at tiny sizes -->
  <path d="M 19 34 L 27 42 L 45 22" fill="none" stroke="#1a1a1a" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Centered Checkmark -->
  <path d="M 19 34 L 27 42 L 45 22" fill="none" stroke="#ACCDB5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
</svg>
